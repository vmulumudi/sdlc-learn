server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness/readiness probe target for Container Apps (phase 8).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same job as the Vite dev proxy: the browser calls /api/..., nginx forwards to the API.
    # "api" is the compose service name; Docker's internal DNS resolves it.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths fall back to index.html so client-side routes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
